name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded PR runs, never main runs. On a PR a newer push makes the
  # old one irrelevant. On main it makes a commit that never got an image: two
  # merges in quick succession cancelled the first, and `f25cf5a` has no entry
  # in the registry as a result. SHA-tagged images exist so any main commit can
  # be deployed or rolled back to (§14.1) — a gap in that sequence is the one
  # thing the tagging scheme is supposed to rule out.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # The app doesn't exist yet (DESIGN.md §12 step 1). Rather than let CI be red
  # from commit one, each suite is gated on the files it needs. Note that
  # hashFiles() is not available in a job-level `if`, so the detection has to
  # happen in a step and reach the other jobs through `needs`.
  detect:
    name: Detect suites
    runs-on: ubuntu-latest
    outputs:
      rails: ${{ steps.check.outputs.rails }}
      frontend: ${{ steps.check.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: |
          test -f Gemfile && echo "rails=true" >> "$GITHUB_OUTPUT" || echo "rails=false" >> "$GITHUB_OUTPUT"
          test -f frontend/package.json && echo "frontend=true" >> "$GITHUB_OUTPUT" || echo "frontend=false" >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

  ruby:
    name: Rails — rubocop + rspec
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.rails == 'true'

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 10s
          --health-timeout 5s --health-retries 5

    # Same variables compose sets, so config/database.yml resolves identically
    # here and locally. DATABASE_URL is deliberately not used — it would silently
    # override the database name and make CI test a different database than a
    # developer does.
    env:
      RAILS_ENV: test
      POSTGRES_HOST: localhost
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      REDIS_URL: redis://localhost:6379/1

    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Lint
        run: bundle exec rubocop --parallel

      # db:test:prepare, not db:prepare — the latter runs db:seed on a fresh
      # database, and seed data in the test database shadows the records specs
      # create. A single-store v1 resolves the current store as Store.first, so
      # a seeded store silently wins over the one a spec just built.
      - name: Prepare database
        run: bin/rails db:test:prepare

      # Coverage gates are enforced in-process by SimpleCov (spec/spec_helper.rb):
      # 90% overall, 100% line and branch on app/scheduler/**. A shortfall exits
      # non-zero here — there is no separate gate step to keep in sync.
      - name: Specs
        run: bundle exec rspec

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  frontend:
    name: Frontend — lint + types + vitest
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.frontend == 'true'
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      # Same pin as local dev and the Docker build — .node-version is the single
      # source of truth, read by mise, setup-node, and the frontend image.
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build   # tsc -b runs as part of the build
      - run: npm run test:run

  # Stands the whole system up on a real cluster and drives it (§12 step 4).
  #
  # This is the job that earns its runtime. Every §14 correction so far — /up
  # admitting pods with no database, the migrate Job losing its retry budget to
  # headless-Service DNS, ActionCable refusing plain-http websockets — was
  # invisible to the unit suites and obvious the moment something was deployed.
  # Nothing below is mocked.
  cluster:
    name: Cluster — deploy and smoke test
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.rails == 'true'
    timeout-minutes: 25

    env:
      # The cluster serves https only (§14.5); port 80 is not published at all.
      SHOP: https://boba.localtest.me:8443
      # Deliberately *not* CURL_CA_BUNDLE at job level. curl reads it from the
      # environment on every invocation, including the ones inside third-party
      # actions — helm/kind-action downloads kind with curl, before bin/k8s-up
      # has written the file, and the whole job died on
      # "error setting certificate file". It is set per-step below instead, on
      # the steps that talk to the ingress and only after the file exists.

    steps:
      - uses: actions/checkout@v4

      - uses: helm/kind-action@v1
        with:
          version: v0.32.0
          cluster_name: boba-gals
          config: k8s/kind/cluster.yaml

      # Runs the same script a developer runs, so the script is covered too —
      # a broken bin/k8s-up is a broken onboarding, and nobody notices until
      # they try it.
      - name: Deploy
        run: bin/k8s-up

      # Asserts the *result* of the migrate Job, not the Job object — that is
      # reaped by ttlSecondsAfterFinished and would make this time-sensitive.
      # `bin/k8s-up` already waits for the Job to complete, so what is left to
      # prove is that db:prepare bootstrapped an empty database: schema applied
      # and seeds run, without which every endpoint 404s on Store.first!
      # (ADR-0007).
      - name: The database was created, migrated, and seeded
        run: |
          kubectl -n boba-gals exec deploy/web -- bin/rails runner '
            abort("no store — seeds did not run") unless Store.exists?
            abort("no menu — seeds did not run") unless MenuItem.exists?
            abort("no admin — §13.4 needs one") unless AdminUser.exists?
            puts "store=#{Store.first.name} menu_items=#{MenuItem.count}"
          '

      # Two replicas from the first deploy is a design requirement (§14.2), not
      # a default — a single pod hides the in-process assumptions §14.4 exists
      # to prevent.
      - name: Two web pods are Ready
        run: |
          ready=$(kubectl -n boba-gals get deploy/web -o jsonpath='{.status.readyReplicas}')
          echo "readyReplicas=$ready"
          [ "$ready" = "2" ]

      # §14.5, ADR-0027. A real percentage in `status.currentMetrics`, not just
      # a clean `apply`, is what proves metrics-server is actually feeding the
      # autoscaler — an HPA object can exist and still be blind if the metrics
      # pipeline is broken, which reads identically to "nothing to scale" until
      # something checks. A few scrape cycles have to land first, hence the
      # retry loop rather than asserting once.
      - name: The web HPA reads real CPU metrics
        run: |
          utilization=""
          for _ in $(seq 1 30); do
            utilization=$(kubectl -n boba-gals get hpa/web -o jsonpath='{.status.currentMetrics[0].resource.current.averageUtilization}' 2>/dev/null)
            [ -n "$utilization" ] && break
            sleep 5
          done
          echo "web HPA current CPU utilization: ${utilization:-<unset>}%"
          [ -n "$utilization" ] || { echo "::error::HPA never read a real CPU value — metrics-server isn't feeding it"; exit 1; }

      # §14.5, ADR-0027. The value, not just the object's existence — a PDB
      # applied with the wrong minAvailable would still be present and protect
      # nothing.
      - name: The web PodDisruptionBudget guarantees one pod stays up
        run: |
          min=$(kubectl -n boba-gals get pdb/web -o jsonpath='{.spec.minAvailable}')
          echo "web PDB minAvailable=$min"
          [ "$min" = "1" ]

      # Every request from here down validates against the CA cert-manager
      # minted, and there is no `-k` anywhere. `-k` would make these steps pass
      # against the fake certificate ingress-nginx serves when issuance fails,
      # which is the one thing they exist to catch.
      - name: Frontend and API answer through the ingress over TLS
        env:
          CURL_CA_BUNDLE: tmp/boba-ca.crt
        run: |
          curl -fsS -o /dev/null "$SHOP/"
          curl -fsS -o /dev/null "$SHOP/board"
          curl -fsS "$SHOP/api/v1/board" | tee /dev/stderr | grep -q '"type":"board_update"'
          curl -fsS -o /dev/null "$SHOP/api/v1/health"

      # The reason TLS could not wait for step 10 (§14.5). Over plain http Rails
      # still issued this cookie and the browser dropped it, so admin sign-in
      # worked under curl and silently did not work in a browser — and the
      # step 9 dashboard is the first browser surface behind it.
      - name: The admin session cookie is Secure and now has an origin that can keep it
        env:
          CURL_CA_BUNDLE: tmp/boba-ca.crt
        run: |
          curl -fsS -i -X POST "$SHOP/api/v1/admin/session" \
            -H 'Content-Type: application/json' \
            -d '{"email":"admin@bobagals.test","password":"dev-admin"}' \
            | grep -i '^set-cookie' | grep -qi 'secure'

      # §14.3, ADR-0008. /up is liveness and must stay green without the
      # database; /readyz is readiness and must not.
      - name: Probes report their dependencies
        run: |
          kubectl -n boba-gals exec deploy/web -- curl -fsS localhost:3000/readyz | grep -q '"database":true'
          kubectl -n boba-gals exec deploy/web -- curl -fsS localhost:3000/readyz | grep -q '"redis":true'

      # kube-prometheus-stack itself is not installed in CI (bin/k8s-up skips
      # it when $CI is set — real memory weight for no proof this job needs).
      # This is the app-side half of §15 instead: the gauges are computed
      # fresh from Postgres on every scrape (config/initializers/yabeda.rb),
      # so a real number here — not just a 200 — is what proves that query
      # path actually works against the seeded database, not just in a spec.
      - name: /metrics serves real data
        run: |
          kubectl -n boba-gals exec deploy/web -- curl -fsS localhost:3000/metrics \
            | grep -q '^boba_gals_queue_depth{store="1"} '

      # `worker` has no Puma process — this is its own standalone exporter
      # thread (ADR-0026), on its own port, proven the same way as `web`'s: a
      # real number from yabeda-sidekiq, not just a 200. `sidekiq_active_processes`
      # is always >= 1 here since it's read from the very process answering
      # the scrape.
      - name: worker's standalone exporter serves real data
        run: |
          kubectl -n boba-gals exec deploy/worker -- curl -fsS localhost:9394/metrics \
            | grep -q '^sidekiq_active_processes '

      # force_ssl (§14.5) redirects plain http, and the kubelet reaches the pod
      # directly with no X-Forwarded-Proto — so without the exclusion in
      # config/environments/production.rb both probes would answer 301. The
      # kubelet counts a 3xx as success, which would leave /readyz reporting
      # healthy with the database down and quietly undo ADR-0008. Asserting the
      # status code, because a redirect is exactly what a passing probe would
      # look like. /metrics joins the list for the same reason — Prometheus
      # reaches the Service the same direct way (§15).
      - name: The probes and /metrics are excluded from the https redirect
        run: |
          for path in up readyz metrics; do
            code=$(kubectl -n boba-gals exec deploy/web -- \
              curl -s -o /dev/null -w '%{http_code}' "localhost:3000/$path")
            echo "/$path over plain http: $code"
            [ "$code" = "200" ] || { echo "::error::/$path answered $code, not 200 — redirected probes pass while failing"; exit 1; }
          done

      # Everything else must be redirected, or the exclusion is a hole rather
      # than an exception.
      - name: Everything else over plain http is redirected
        run: |
          code=$(kubectl -n boba-gals exec deploy/web -- \
            curl -s -o /dev/null -w '%{http_code}' localhost:3000/api/v1/health)
          echo "/api/v1/health over plain http: $code"
          case "$code" in
            30*) ;;
            *) echo "::error::plain http was served ($code) instead of redirected"; exit 1 ;;
          esac

      # The property the whole probe split exists for: losing a dependency must
      # pull pods from the Service *without* restarting them.
      - name: Readiness ejects pods when Redis goes, liveness does not restart them
        env:
          CURL_CA_BUNDLE: tmp/boba-ca.crt
        run: |
          # bin/k8s-up ends with a rollout restart, which can leave a pod
          # Terminating. Settle first, or the measurement below straddles a
          # changing pod set.
          kubectl -n boba-gals rollout status deployment/web --timeout=180s
          kubectl -n boba-gals wait --for=delete pod -l app=web \
            --field-selector=status.phase==Succeeded --timeout=60s 2>/dev/null || true

          restarts() {
            kubectl -n boba-gals get pods -l app=web \
              -o jsonpath='{.items[*].status.containerStatuses[*].restartCount}' \
              | tr ' ' '\n' | awk '{ s += $1 } END { print s + 0 }'
          }

          echo "pods=$(kubectl -n boba-gals get pods -l app=web --no-headers | wc -l) restarts=$(restarts)"

          kubectl -n boba-gals scale statefulset/redis --replicas=0
          for _ in $(seq 1 30); do
            addrs=$(kubectl -n boba-gals get endpoints web -o jsonpath='{.subsets[*].addresses[*].ip}' 2>/dev/null | wc -w | tr -d ' ')
            [ "$addrs" = "0" ] && break
            sleep 2
          done
          [ "$addrs" = "0" ] || { echo "::error::web stayed in the Service without Redis"; exit 1; }

          # A total, not a per-pod list. The first version compared
          # '{restartCount}' strings and read [0 0 0] vs [0 0] — a pod finishing
          # termination — as a restart. The property is simply that liveness
          # never fired, so nothing should ever have restarted.
          after=$(restarts)
          echo "restarts after redis outage: $after"
          [ "$after" = "0" ] || { echo "::error::liveness restarted pods over a dependency outage"; exit 1; }

          kubectl -n boba-gals scale statefulset/redis --replicas=1
          kubectl -n boba-gals rollout status statefulset/redis --timeout=120s
          kubectl -n boba-gals wait --for=condition=Ready pod -l app=web --timeout=120s

          # Pods being Ready is not the same as the ingress serving them.
          # ingress-nginx re-syncs its upstream list on its own schedule, so
          # there is a window where every pod is Ready and requests still get a
          # 503 from an empty backend. Wait for the observable condition rather
          # than a proxy for it.
          for _ in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$SHOP/api/v1/board")
            [ "$code" = "200" ] && break
            sleep 2
          done
          echo "ingress serving again: HTTP $code"
          [ "$code" = "200" ] || { echo "::error::ingress never recovered after the Redis outage"; exit 1; }

      # A placed order has to reach the board. This exercises the full path —
      # ingress, Rails, Postgres, the ETA, and the serializer — end to end.
      - name: An order reaches the board
        env:
          CURL_CA_BUNDLE: tmp/boba-ca.crt
        run: |
          curl -fsS -X POST "$SHOP/api/v1/orders" \
            -H 'Content-Type: application/json' \
            -d '{"order":{"source":"kiosk","customer_first_name":"Smoke","items":[{"menu_item_id":1,"option_ids":[1,6]}]}}' \
            | grep -q '"pickup_code"'
          curl -fsS "$SHOP/api/v1/board" | tee /dev/stderr | grep -q '"first_name":"Smoke"'

      # §13.5, and the one most worth holding on a public endpoint.
      # `if`, not `grep ... && { exit 1; } || true` — the trailing `|| true`
      # swallows the very exit it is guarding, so that form can never fail.
      - name: customer_phone never appears on the board
        env:
          CURL_CA_BUNDLE: tmp/boba-ca.crt
        run: |
          curl -fsS "$SHOP/api/v1/board" > /tmp/board.json
          if grep -q "customer_phone" /tmp/board.json; then
            echo "::error::customer_phone reached a public payload (§13.5)"; exit 1
          fi

      - name: Diagnostics
        if: failure()
        run: |
          kubectl -n boba-gals get pods -o wide || true
          kubectl -n boba-gals describe pods || true
          kubectl -n boba-gals logs -l app=web --tail=100 || true
          kubectl -n boba-gals logs -l app=worker --tail=50 || true
          kubectl -n boba-gals get jobs -o yaml || true

  # Build and publish (§14.1, §14.5). Only on main, and only once the suites and
  # the cluster smoke test have passed — an image nobody could deploy is not
  # worth a registry entry.
  images:
    name: Images — build and push
    runs-on: ubuntu-latest
    needs: [ruby, frontend, cluster]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # §14.1: tagged with the git SHA, never `latest`. A moving tag makes
      # "which code is running" unanswerable, and makes a rollback a rebuild.
      - name: Build and push boba-api
        uses: docker/build-push-action@v6
        with:
          context: .
          target: production
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/boba-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # buildx publishes a provenance attestation as a separate untagged
          # manifest, so each push creates three package versions rather than
          # one. min-versions-to-keep counts all of them, which would make
          # "keep 3" mean "keep only the current image" and leave no rollback
          # target at all. Nothing here consumes attestations.
          provenance: false
          sbom: false

      - name: Build and push boba-frontend
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/boba-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # buildx publishes a provenance attestation as a separate untagged
          # manifest, so each push creates three package versions rather than
          # one. min-versions-to-keep counts all of them, which would make
          # "keep 3" mean "keep only the current image" and leave no rollback
          # target at all. Nothing here consumes attestations.
          provenance: false
          sbom: false

      # §14.5 ends with `kubectl apply -k k8s/overlays/prod`. There is no
      # reachable cluster yet — the only one is a kind cluster on a laptop — so
      # this renders exactly what would be applied and publishes it as an
      # artifact rather than pretending to deploy. When a real cluster exists,
      # this step gains the apply and loses the upload.
      - uses: azure/setup-kubectl@v4

      # §14.5 names `kustomize edit set image`; this substitutes the
      # `set-by-ci` placeholder directly instead. Same result, and it avoids
      # installing the standalone kustomize binary purely to mutate one line —
      # `kubectl kustomize` can render but not edit. The placeholder is a tag
      # that cannot exist, so a broken substitution fails to pull rather than
      # silently deploying whatever was there before.
      - name: Render the prod overlay at this SHA
        run: |
          sed -i "s|newTag: set-by-ci|newTag: ${{ github.sha }}|g" k8s/overlays/prod/kustomization.yaml
          kubectl kustomize k8s/overlays/prod > prod-manifests.yaml

          if grep -q "set-by-ci" prod-manifests.yaml; then
            echo "::error::an image tag was left unset"; exit 1
          fi
          grep "image: ghcr.io" prod-manifests.yaml

      - uses: actions/upload-artifact@v4
        with:
          name: prod-manifests-${{ github.sha }}
          path: prod-manifests.yaml
          retention-days: 30

      # Nothing in GHCR expires on its own, and every merge adds a version.
      # Private-repo storage is 500 MB on a Free plan; boba-api alone is ~130 MB
      # compressed, so without this the registry fills and pushes start failing
      # at whatever moment is least convenient.
      #
      # Three is current plus two rollback targets. §14.5 has no progressive
      # delivery, so a rollback is "redeploy an earlier SHA", and below three
      # that stops being possible.
      #
      # Three rather than five because it is safe under either way GitHub might
      # account for storage. Measured: only the ~44MB app layer differs per
      # commit — the Debian base, Ruby build, apt packages and gems are shared
      # blobs. So three versions is ~180MB if billing counts deduplicated
      # blobs, and ~450MB if it sums whole versions. Five would be ~210MB or
      # ~755MB, and the second of those blows the 500MB private-repo quota.
      # Not worth discovering which by hitting the error mid-deploy.
      - name: Prune old image versions
        uses: actions/delete-package-versions@v5
        with:
          package-name: boba-api
          package-type: container
          min-versions-to-keep: 3

      - name: Prune old frontend image versions
        uses: actions/delete-package-versions@v5
        with:
          package-name: boba-frontend
          package-type: container
          min-versions-to-keep: 3

  # Always runs, so branch protection has one stable required check to point at
  # even while the gated jobs above are still skipping.
  ci:
    name: CI
    runs-on: ubuntu-latest
    needs: [detect, ruby, frontend, cluster]
    if: always()
    steps:
      - name: Check results
        run: |
          echo "detect=${{ needs.detect.result }}"
          echo "ruby=${{ needs.ruby.result }}"
          echo "frontend=${{ needs.frontend.result }}"
          echo "cluster=${{ needs.cluster.result }}"
          for r in "${{ needs.detect.result }}" "${{ needs.ruby.result }}" "${{ needs.frontend.result }}" "${{ needs.cluster.result }}"; do
            case "$r" in
              success|skipped) ;;
              *) echo "::error::a required job did not pass"; exit 1 ;;
            esac
          done
