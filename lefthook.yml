# Git hooks. Install once with: lefthook install
#
# Hooks run in a non-interactive shell where a version manager's shell
# activation has not happened, so `ruby` would resolve to whatever system Ruby
# exists (2.6 on stock macOS) rather than the pinned .ruby-version. Prepending
# mise's shims fixes that, and is a no-op for anyone using rbenv/asdf/chruby.

commit-msg:
  commands:
    conventional-commit:
      run: |
        set -e
        msg=$(head -1 "{1}")
        # Allow merges, reverts, and fixup/squash commits through untouched.
        case "$msg" in
          Merge*|Revert*|fixup!*|squash!*) exit 0 ;;
        esac
        pattern='^(feat|fix|docs|test|refactor|perf|chore|build|ci)(\([a-z0-9-]+\))?!?: .{1,}'
        if ! printf '%s' "$msg" | grep -qE "$pattern"; then
          echo "✗ Commit message must follow Conventional Commits."
          echo "  got:      $msg"
          echo "  expected: feat(scheduler): add deficit round robin dispatch"
          echo "  types:    feat fix docs test refactor perf chore build ci"
          echo "  scopes:   scheduler kds board ordering sim api web k8s ci docs"
          exit 1
        fi
        if [ ${#msg} -gt 72 ]; then
          echo "✗ Subject line is ${#msg} chars; keep it under 72."
          exit 1
        fi

pre-commit:
  parallel: true
  commands:
    rubocop:
      glob: "*.rb"
      # No `|| true`: a lint failure must fail the commit. A guard that always
      # passes is worse than no guard, because it looks armed.
      run: |
        set -e
        [ -d "$HOME/.local/share/mise/shims" ] && PATH="$HOME/.local/share/mise/shims:$PATH"
        export PATH
        bundle exec rubocop --force-exclusion --autocorrect {staged_files}
      stage_fixed: true

    oxlint:
      root: "frontend/"
      glob: "frontend/*.{ts,tsx}"
      run: |
        set -e
        [ -d "$HOME/.local/share/mise/shims" ] && PATH="$HOME/.local/share/mise/shims:$PATH"
        export PATH
        npx oxlint --fix {staged_files}
      stage_fixed: true

    # The design is explicit: secrets come from the environment only (§14.6),
    # and customer_phone never lands in logs or fixtures (§13.5).
    no-secrets:
      run: |
        if git diff --cached --name-only | grep -qE '(^|/)(\.env$|\.env\.|master\.key$|credentials/.*\.key$)'; then
          echo "✗ Refusing to commit a secret file. See DESIGN.md §14.6."
          exit 1
        fi
