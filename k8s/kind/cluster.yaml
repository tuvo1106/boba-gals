# Local cluster for build step 4 (§14.2).
#
# One control-plane node is enough: nothing in the design is scheduling-aware,
# and the multi-pod correctness this project cares about (§14.4) is about
# *processes* not sharing memory, which two pods on one node already prove.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      # ingress-nginx's kind deployment schedules onto a node carrying this
      # label and tolerates the control-plane taint. Without it the controller
      # stays Pending forever on a single-node cluster.
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      # Publishes the ingress on the host so the shop is reachable the same way
      # http://localhost:5173 was under compose — same-origin, which the admin
      # session cookie requires (ADR-0006).
      #
      # 443 only. Port 80 is deliberately *not* published (§14.5): a plain-http
      # surface that appeared to work is exactly what let the Secure admin
      # cookie be dropped with nothing reporting it, and a redirect from :8080
      # would have to point at :8443 — a port-rewriting redirect that exists
      # nowhere in a real deploy. Refusing the connection is unmistakable;
      # serving http quietly is not.
      - containerPort: 443
        hostPort: 8443
        protocol: TCP
