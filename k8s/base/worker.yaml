# Sidekiq (§14.1, §14.2). Same image as `web`, different command — which is the
# whole reason the Dockerfile has one runtime stage rather than two.
#
# Today it runs the board's trailing broadcast flush (§9.2). It gains the ETA
# recompute and idle tick (§7.2) at step 7, and the abandoned-order sweep
# (§5.1), quality-timer checks (§9.6) and SMS (§9.7) at step 8 — all via
# sidekiq-cron, never cron in a container.
apiVersion: v1
kind: Service
metadata:
  name: worker
  # This pod serves no application traffic — this Service exists only so
  # k8s/monitoring/worker-service-monitor.yaml (§15, ADR-0026) has a stable
  # target for the standalone exporter thread config/initializers/yabeda_sidekiq.rb
  # starts on the `metrics` port. The label is on the Service, for the
  # ServiceMonitor's selector — distinct from `spec.selector` below, which
  # picks pods.
  labels:
    app: worker
spec:
  selector:
    app: worker
  ports:
    - name: metrics
      port: 9394
      targetPort: metrics
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
        - name: worker
          image: boba-api
          command: ["bundle", "exec", "sidekiq"]
          ports:
            - name: metrics
              containerPort: 9394
          envFrom:
            - configMapRef: { name: boba-config }
            - secretRef: { name: boba-secrets }
          # Liveness only — it serves no traffic, so there is nothing for a
          # readiness gate to gate (§14.3). A process check rather than the
          # sidekiq_alive gem: one fewer dependency and one fewer port, and it
          # answers the question the kubelet is actually asking. The metrics
          # port above is scraped, not probed (§15) — it has no bearing on
          # whether this pod is healthy.
          livenessProbe:
            exec:
              command: ["pgrep", "-f", "sidekiq"]
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3
          resources:
            requests: { cpu: 100m, memory: 384Mi }
            limits: { memory: 1Gi }
      # Sidekiq's default shutdown gives running jobs 25s to finish before they
      # are pushed back to Redis. The grace period has to exceed that or
      # Kubernetes SIGKILLs the process mid-drain.
      terminationGracePeriodSeconds: 40
