# The React bundle served by nginx (§14.1).
#
# nginx proxies nothing — routing /api and /cable to `web` is the ingress's job
# (§14.2). This serves static files and the SPA fallback, nothing else.
apiVersion: v1
kind: Service
metadata:
  name: frontend
spec:
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: boba-frontend
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet: { path: /index.html, port: http }
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /index.html, port: http }
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests: { cpu: 20m, memory: 32Mi }
            limits: { memory: 128Mi }
