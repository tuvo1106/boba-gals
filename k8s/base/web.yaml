# The Rails API and ActionCable (§14.2).
#
# **Two replicas from the start**, even though one would do. §14.2 is explicit
# that this is the point: a single pod hides in-process assumptions, and the
# design has three places where such an assumption would be a bug — the ETA
# debounce lock (§7.2), the board broadcast throttle (§9.2), and ActionCable's
# adapter (§14.4). All three are Redis-backed for this reason, and running two
# pods is what keeps them honest.
apiVersion: v1
kind: Service
metadata:
  name: web
  # The label is on the Service object itself, for k8s/monitoring/
  # service-monitor.yaml's selector (§15) — distinct from `spec.selector`
  # below, which picks pods, not this Service. Without its own label here a
  # ServiceMonitor selecting `app: web` silently matches nothing.
  labels:
    app: web
spec:
  selector:
    app: web
  ports:
    - name: http
      port: 3000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
spec:
  # `replicas` deliberately absent, not just "left at 2" (§14.5, ADR-0027): the
  # HorizontalPodAutoscaler below owns this field once it exists, writing
  # directly to the Deployment's `spec.replicas`. `kubectl apply` only touches
  # fields present in the manifest, so omitting it here means every deploy
  # leaves whatever the HPA currently has running alone. Setting it to a fixed
  # number would fight the HPA on every `kubectl apply -k`, resetting replica
  # count back to that number and undoing whatever scaling had happened. The
  # HPA's own `minReplicas: 2` is what still guarantees the two-pod floor this
  # comment describes.
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: boba-api
          command: ["bundle", "exec", "puma", "-C", "config/puma.rb"]
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef: { name: boba-config }
            - secretRef: { name: boba-secrets }
          # Readiness checks Postgres and Redis; liveness only checks that the
          # process is alive. §14.3 asked for /up on both, on the premise that
          # it "raises if the app can't boot its connections" — Rails' own docs
          # say otherwise, and a pod with no database answers /up 200 and gets
          # sent traffic it can only fail. ADR-0008 records the split.
          #
          # Neither probe uses /api/v1/health: that is business-level and
          # includes `stores.accepting_orders`, so an owner switching ordering
          # off must never restart pods (§14.3).
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /up, port: http }
            # Slower and more forgiving than readiness on purpose, and pointedly
            # not gated on the database: a Postgres blip should pull pods from
            # the Service, not restart all of them at once.
            initialDelaySeconds: 20
            periodSeconds: 15
            failureThreshold: 5
          # Gives Puma time to finish in-flight requests and, more importantly,
          # lets ActionCable clients see the socket close and reconnect to the
          # surviving pod rather than hanging (§14.4). The board runs unattended
          # all day; a silent dead socket is the worst failure it has.
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
          resources:
            requests: { cpu: 200m, memory: 512Mi }
            limits: { memory: 1Gi }
      terminationGracePeriodSeconds: 30
---
# CPU-based autoscaling (§14.5, ADR-0027) — `web` is stateless per-request
# (§14.4), so scaling on CPU alone is sufficient; no custom or business
# metric is needed to decide replica count the way one would be for a
# queue-depth-driven worker.
#
# `minReplicas: 2` is not a scaling choice, it is §14.2's non-negotiable
# floor restated: the Deployment above deliberately carries no `replicas`
# field once this exists, so this is the only thing keeping the pod count
# from ever dropping to 1 and hiding the in-process assumptions the two-pod
# baseline exists to catch.
#
# `maxReplicas: 6` is sized off Postgres, not off traffic: each `web` pod
# opens up to `RAILS_MAX_THREADS` (5, `k8s/base/config.yaml`) connections, so
# 6 pods tops out at 30 — comfortably under `postgres:16`'s default
# `max_connections: 100` with room left for `worker` and any manual `psql`.
# Revisit alongside `RAILS_MAX_THREADS` or `max_connections`, not in
# isolation.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: web
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: web
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
# Voluntary-disruption budget (§14.5, ADR-0027) — bounds how many `web` pods
# a node drain, cluster upgrade, or `kubectl rollout` can take down at once.
#
# `minAvailable: 1` rather than `maxUnavailable: 1`: at the HPA's own floor of
# 2 replicas the two mean the same thing, but `minAvailable` stays the
# guarantee that actually matters — "at least one pod always serving" — if
# the HPA ever scales up, where a fixed `maxUnavailable: 1` would quietly let
# a growing fraction of the fleet go down at once instead.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: web
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: web
