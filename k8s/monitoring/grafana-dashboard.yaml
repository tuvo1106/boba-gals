# §15: "One Grafana dashboard mirroring the §10.4 headline chart (small-order
# p90 vs. large-order rate)." Discovered by Grafana's dashboard sidecar
# (values file enables it, `searchNamespace: ALL`) via the grafana_dashboard
# label — no manual import step. Same CRD-dependency note as
# service-monitor.yaml: applied after the chart, never part of k8s/base.
apiVersion: v1
kind: ConfigMap
metadata:
  name: boba-gals-headline-dashboard
  namespace: boba-gals
  labels:
    grafana_dashboard: "1"
data:
  boba-gals-headline.json: |
    {
      "title": "Boba Gals — Fair Queuing Headline",
      "uid": "boba-gals-headline",
      "tags": ["boba-gals"],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "30s",
      "time": { "from": "now-6h", "to": "now" },
      "panels": [
        {
          "id": 1,
          "type": "timeseries",
          "title": "Small-order (1-2 drinks) wait, p90",
          "description": "DESIGN.md §10.4: if fair queuing is working, this line is flat regardless of the panel below it. A slope means the quantum is too large.",
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 0 },
          "fieldConfig": {
            "defaults": { "unit": "s", "custom": { "drawStyle": "line", "fillOpacity": 10 } }
          },
          "targets": [
            {
              "expr": "histogram_quantile(0.9, sum(rate(boba_gals_order_wait_seconds_bucket{size_class=\"1-2\"}[$__rate_interval])) by (le, store))",
              "legendFormat": "store {{store}}"
            }
          ]
        },
        {
          "id": 2,
          "type": "timeseries",
          "title": "Concurrent large-order rate (7+ drinks)",
          "description": "DESIGN.md §10.4: fraction of currently open orders that are large — the live analogue of the simulator's swept large_order_rate parameter (§10.3, §11).",
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 8 },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "min": 0,
              "max": 1,
              "custom": { "drawStyle": "line", "fillOpacity": 10 }
            }
          },
          "targets": [
            {
              "expr": "boba_gals_concurrent_large_order_rate",
              "legendFormat": "store {{store}}"
            }
          ]
        }
      ]
    }
