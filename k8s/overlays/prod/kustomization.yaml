# The deploy target for CI (§14.5): test → build both images → push to GHCR →
# `kubectl apply -k k8s/overlays/prod` with the new SHA tag, set by
# `kustomize edit set image`.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: boba-gals

resources:
  - ../../base

# **No TLS here yet — see issue #106.** `../../base`'s Ingress deliberately
# carries no `host` and no `spec.tls`; dev adds both (`ingress-tls.yaml`,
# `tls.yaml`) and this overlay adds neither. `config.force_ssl` is on in
# production, so a deploy as it stands would redirect to https against an
# Ingress with no certificate, ingress-nginx would serve its built-in fake one,
# and the `SameSite=Strict` + `Secure` admin cookie (ADR-0006) would break
# sign-in — the symptom being "the dashboard won't let me log in", several
# steps from the cause.
#
# Not filled in speculatively: it needs a real domain and an ACME ClusterIssuer,
# and guessing either means rewriting this. It belongs with the change that
# lands an actual prod deploy (ci.yml:490).

# No secretGenerator, deliberately. `boba-secrets` is created out of band and
# never lives in this repo:
#
#   kubectl -n boba-gals create secret generic boba-secrets \
#     --from-literal=POSTGRES_USER=... \
#     --from-literal=POSTGRES_PASSWORD=... \
#     --from-literal=POSTGRES_DB=boba_gals_production \
#     --from-literal=DATABASE_URL=postgresql://... \
#     --from-literal=REDIS_URL=redis://redis:6379/1 \
#     --from-literal=RAILS_MASTER_KEY=... \
#     --from-literal=SEED_ADMIN_PASSWORD=...
#
# SEED_ADMIN_PASSWORD must be a real value before the first deploy — db/seeds.rb
# falls back to `changeme-in-any-real-deploy`, and the seed runs as part of the
# migrate Job on an empty database (ADR-0007).

images:
  # `latest` is never used (§14.1). CI overwrites these with the git SHA; the
  # placeholder is a tag that cannot exist, so a misconfigured pipeline fails to
  # pull rather than silently deploying whatever was there before.
  - name: boba-api
    newName: ghcr.io/tuvo1106/boba-api
    newTag: set-by-ci
  - name: boba-frontend
    newName: ghcr.io/tuvo1106/boba-frontend
    newTag: set-by-ci
