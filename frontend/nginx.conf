server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # One React build serves the kiosk, web ordering, KDS, board, and dashboard
    # (§9.3) — client-side routing means unknown paths must fall back to the
    # app shell rather than 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed filenames from the Vite build are safe to cache indefinitely.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html must never be cached, or a deploy leaves clients pinned to a
    # stale bundle referencing assets that no longer exist.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
